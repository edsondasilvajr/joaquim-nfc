<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f1ea" />
  <title>Contact My Parents</title>
  <style>
    :root{
      --bg:#f4f1ea;
      --card:#fffdf8;
      --text:#24312b;
      --muted:#6b746f;
      --green:#2f4a3f;
      --green2:#49685a;
      --line:#d9ddd8;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      padding:24px;
    }
    .card{
      width:min(100%,440px);
      background:var(--card);
      border:1px solid var(--line);
      border-radius:28px;
      padding:30px 24px 24px;
      box-shadow:0 14px 40px rgba(36,49,43,.08);
      text-align:center;
    }
    .badge{
      width:64px;height:64px;
      margin:0 auto 18px;
      border-radius:20px;
      display:grid;place-items:center;
      background:var(--green);
      color:white;
      font-size:30px;
    }
    h1{
      margin:0;
      font-size:30px;
      line-height:1.1;
      letter-spacing:-.03em;
    }
    .subtitle{
      margin:10px auto 24px;
      color:var(--muted);
      font-size:16px;
      line-height:1.45;
      max-width:320px;
    }
    .buttons{
      display:grid;
      gap:12px;
    }
    a.button{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      text-decoration:none;
      min-height:58px;
      padding:15px 18px;
      border-radius:18px;
      font-weight:700;
      font-size:17px;
      transition:.15s ease;
    }
    a.primary{
      background:var(--green);
      color:#fff;
    }
    a.secondary{
      background:#eef2ef;
      color:var(--green);
      border:1px solid #d8e0db;
    }
    a.button:active{transform:scale(.985)}
    .footer{
      margin-top:22px;
      padding-top:18px;
      border-top:1px solid var(--line);
      color:var(--muted);
      font-size:13px;
      line-height:1.45;
    }
    .small{
      margin-top:8px;
      font-size:12px;
      color:#8a918d;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">♥</div>
    <h1>Hi, I'm Joaquim</h1>
    <p class="subtitle">
      If you found me or this keyring, please contact one of my parents.
    </p>

    <div class="buttons">
      <!-- Replace the numbers below with real numbers in international format, e.g. +61412345678 -->
      <a class="button primary" href="tel:+61426602301">📞 Call Dad</a>
      <a class="button primary" href="tel:+61424855115">📞 Call Mum</a>
      <a class="button secondary" href="sms:+61426602301?body=Hi%2C%20I%20found%20Joaquim%27s%20keyring.">💬 Text Dad</a>
      <a class="button secondary" href="sms:+61424855115?body=Hi%2C%20I%20found%20Joaquim%27s%20keyring.">💬 Text Mum</a>
    </div>

    <div class="footer">
      Thank you for helping.
      <div class="small">No home address or school information is stored on this page.</div>
    </div>
  </main>
</body>
</html>
